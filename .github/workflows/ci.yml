name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-validate:
    name: Build, Validate & Benchmark Test
    runs-on: ubuntu-latest

    env:
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Phase 1 - Synthetic Data Generation & Schema Validation
        run: |
          python main.py --generate
          python main.py --validate data/train.jsonl
          python main.py --validate data/test.jsonl

      - name: Phase 2 - Fine-Tuning Pipeline Dry-Run Verification
        run: |
          python -m training.dry_run

      - name: Phase 3 - Model Export & Modelfile Generation
        run: |
          python -m export.quantize --format gguf

      - name: Phase 4 - Serving Layer Health & Routing Import Verification
        run: |
          python -c "from serving.app import app; print('FastAPI app routes validated successfully!')"

      - name: Phase 5 - Evaluation & Benchmark Suite Execution
        run: |
          python -m evals.benchmark --num_samples 10

      - name: Upload Benchmark Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: |
            evals/results/report.md
            evals/results/report.json
